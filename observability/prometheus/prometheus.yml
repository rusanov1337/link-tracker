global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: link-tracker-apps
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8011
        labels:
          application: bot
          endpoint: bot-management
      - targets:
          - host.docker.internal:8081
        labels:
          application: scrapper
          endpoint: scrapper-http
      - targets:
          - host.docker.internal:8082
        labels:
          application: ai-agent
          endpoint: ai-agent-http
