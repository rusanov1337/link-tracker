services:
  postgres:
    image: postgres:18-alpine
    container_name: link-tracker-postgres
    environment:
      POSTGRES_DB: link_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d link_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrations:
    image: liquibase/liquibase:4.33
    container_name: link-tracker-migrations
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/liquibase/changelog:ro
    command:
      - --search-path=/liquibase/changelog
      - --changelog-file=master.xml
      - --url=jdbc:postgresql://postgres:5432/link_tracker
      - --username=postgres
      - --password=postgres
      - update
    restart: "no"

volumes:
  postgres-data:
