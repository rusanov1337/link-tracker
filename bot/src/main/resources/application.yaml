server:
  port: 8080

spring:
  application:
    name: bot
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      apicurio.registry.url: ${KAFKA_SCHEMA_REGISTRY_URL:http://localhost:8085}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:link-tracker-bot}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        apicurio.registry.use-specific-avro-reader: ${KAFKA_SPECIFIC_AVRO_READER:true}
        spring.deserializer.value.delegate.class: io.apicurio.registry.serde.avro.AvroKafkaDeserializer
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.apicurio.registry.serde.avro.AvroKafkaSerializer
      properties:
        apicurio.registry.auto-register: ${KAFKA_AUTO_REGISTER_SCHEMAS:true}
    listener:
      ack-mode: record

app:
  kafka:
    topics:
      link-updates: ${KAFKA_LINK_UPDATES_TOPIC:link-updates}
      link-updates-dlq: ${KAFKA_LINK_UPDATES_DLQ_TOPIC:link-updates-dlq}
      processing-failure-reports: ${KAFKA_PROCESSING_FAILURE_REPORTS_TOPIC:processing-failure-reports}
      processing-failure-reports-dlq: ${KAFKA_PROCESSING_FAILURE_REPORTS_DLQ_TOPIC:processing-failure-reports-dlq}
    consumer:
      enabled: ${KAFKA_CONSUMER_ENABLED:true}
      max-attempts: ${KAFKA_CONSUMER_MAX_ATTEMPTS:3}
      retry-backoff: ${KAFKA_CONSUMER_RETRY_BACKOFF:1s}
    avro:
      schema-registry-url: ${KAFKA_SCHEMA_REGISTRY_URL:http://localhost:8085}
      auto-register-schemas: ${KAFKA_AUTO_REGISTER_SCHEMAS:true}
      specific-reader: ${KAFKA_SPECIFIC_AVRO_READER:true}
  grpc:
    server:
      enabled: ${BOT_GRPC_SERVER_ENABLED:false}
      port: ${BOT_GRPC_PORT:8090}
  telegram:
    url: https://api.telegram.org/bot
    token: ${TELEGRAM_TOKEN} # Use env variable. DO NOT KEEP TOKEN HERE
    update-listener-sleep: 1s
    max-send-attempts: 3
    delivery-retry-enabled: true
    delivery-retry-interval: 1m
    debug: false
    set-my-commands-enabled: true
  scrapper:
    base-url: ${SCRAPPER_BASE_URL:http://localhost:8081}
    transport: ${SCRAPPER_TRANSPORT:http}
    grpc:
      host: ${SCRAPPER_GRPC_HOST:localhost}
      port: ${SCRAPPER_GRPC_PORT:8091}
