server:
  port: 8081

spring:
  application:
    name: scrapper
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      apicurio.registry.url: ${KAFKA_SCHEMA_REGISTRY_URL:http://localhost:8085}
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.apicurio.registry.serde.avro.AvroKafkaSerializer
      properties:
        apicurio.registry.auto-register: ${KAFKA_AUTO_REGISTER_SCHEMAS:true}
  data:
    redis:
      host: ${VALKEY_HOST:localhost}
      port: ${VALKEY_PORT:6379}
      password: ${VALKEY_PASSWORD:}
      timeout: ${VALKEY_TIMEOUT:2s}
  datasource:
    url: ${SCRAPPER_DB_URL:jdbc:postgresql://localhost:5432/link_tracker}
    username: ${SCRAPPER_DB_USERNAME:postgres}
    password: ${SCRAPPER_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:/migrations/master.xml
    enabled: true

management:
  health:
    redis:
      enabled: ${VALKEY_HEALTH_ENABLED:false}

app:
  cache:
    tracked-links:
      enabled: ${TRACKED_LINKS_CACHE_ENABLED:true}
      ttl: ${TRACKED_LINKS_CACHE_TTL:10m}
      key-prefix: ${TRACKED_LINKS_CACHE_KEY_PREFIX:tracked-links}
  kafka:
    topics:
      link-updates: ${KAFKA_LINK_UPDATES_TOPIC:link-updates}
      link-updates-dlq: ${KAFKA_LINK_UPDATES_DLQ_TOPIC:link-updates-dlq}
      processing-failure-reports: ${KAFKA_PROCESSING_FAILURE_REPORTS_TOPIC:processing-failure-reports}
      processing-failure-reports-dlq: ${KAFKA_PROCESSING_FAILURE_REPORTS_DLQ_TOPIC:processing-failure-reports-dlq}
    consumer:
      max-attempts: ${KAFKA_CONSUMER_MAX_ATTEMPTS:3}
      retry-backoff: ${KAFKA_CONSUMER_RETRY_BACKOFF:1s}
    avro:
      schema-registry-url: ${KAFKA_SCHEMA_REGISTRY_URL:http://localhost:8085}
      auto-register-schemas: ${KAFKA_AUTO_REGISTER_SCHEMAS:true}
  database:
    access-type: ${SCRAPPER_DB_ACCESS_TYPE:SQL}
    page-size: ${SCRAPPER_DB_PAGE_SIZE:500}
  grpc:
    server:
      enabled: ${SCRAPPER_GRPC_SERVER_ENABLED:false}
      port: ${SCRAPPER_GRPC_PORT:8091}
  bot:
    base-url: ${BOT_BASE_URL:http://localhost:8080}
    transport: ${BOT_TRANSPORT:kafka}
    grpc:
      host: ${BOT_GRPC_HOST:localhost}
      port: ${BOT_GRPC_PORT:8090}
  scheduler:
    enabled: true
    interval: 60000
    batch-size: ${SCRAPPER_SCHEDULER_BATCH_SIZE:500}
    parallelism: ${SCRAPPER_SCHEDULER_PARALLELISM:1}
    processing-lease: ${SCRAPPER_SCHEDULER_PROCESSING_LEASE:300000}
  stackoverflow:
    base-url: ${STACKOVERFLOW_BASE_URL:https://api.stackexchange.com}
    site: ${STACKOVERFLOW_SITE:stackoverflow}
    key: ${STACKOVERFLOW_KEY:} # Use env variable. DO NOT KEEP TOKEN HERE
    access-token: ${STACKOVERFLOW_ACCESS_TOKEN:} # Use env variable. DO NOT KEEP TOKEN HERE
  github:
    base-url: ${GITHUB_BASE_URL:https://api.github.com}
    token: ${GITHUB_TOKEN:} # Use env variable. DO NOT KEEP TOKEN HERE
